<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3000円 お買い物電卓</title>
<style>
  body{
    margin:0;
    background:#f4f4f4;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    color:#222;
  }
  .wrap{
    max-width:420px;
    margin:20px auto;
    padding:16px;
  }
  .budget{
    text-align:center;
    font-size:26px;
    font-weight:800;
    margin-bottom:14px;
  }
  .display{
    background:#111;
    color:#fff;
    font-size:44px;
    font-weight:800;
    text-align:right;
    padding:18px;
    border-radius:14px;
    margin-bottom:14px;
    min-height:54px;
  }
  .message{
    min-height:48px;
    text-align:center;
    font-size:26px;
    font-weight:900;
    margin-bottom:12px;
    color:#d00000;
  }
  .keys{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  button{
    min-height:66px;
    border:none;
    border-radius:14px;
    font-size:28px;
    font-weight:800;
    background:white;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  button:active{
    transform:scale(.98);
    background:#e9e9e9;
  }
  .clear{
    background:#ffe2e2;
  }
  .plus{
    grid-column:span 2;
    background:#cfe0ff;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="budget">よさん 3000えん</div>
  <div id="display" class="display">0</div>
  <div id="message" class="message" aria-live="assertive"></div>

  <div class="keys">
    <button onclick="num('7')">7</button>
    <button onclick="num('8')">8</button>
    <button onclick="num('9')">9</button>

    <button onclick="num('4')">4</button>
    <button onclick="num('5')">5</button>
    <button onclick="num('6')">6</button>

    <button onclick="num('1')">1</button>
    <button onclick="num('2')">2</button>
    <button onclick="num('3')">3</button>

    <button onclick="num('0')">0</button>
    <button class="clear" onclick="clearAll()">C</button>
    <button class="plus" onclick="add()">＋</button>
  </div>
</div>

<script>
let current = "0";
let total = 0;
let showingTotal = false;

function updateDisplay(value = current){
  document.getElementById("display").textContent = value;
}

function num(n){
  if(showingTotal){
    current = "0";
    showingTotal = false;
  }
  current = (current === "0") ? n : current + n;
  updateDisplay();
}

function add(){
  const value = Number(current) || 0;
  total += value;
  current = "0";
  showingTotal = true;
  updateDisplay(total);
  checkLimit(total);
}

function clearAll(){
  current = "0";
  total = 0;
  showingTotal = false;
  document.getElementById("message").textContent = "";
  updateDisplay();
}

function checkLimit(value){
  if(value > 3000){
    document.getElementById("message").textContent =
      "ブッブー！ 3000えんをこえています";
    buzz();
  } else {
    document.getElementById("message").textContent = "";
  }
}

function buzz(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();

    setTimeout(() => {
      try { osc.stop(); ctx.close(); } catch(e) {}
    }, 500);
  }catch(e){}
}
</script>
</body>
</html>
